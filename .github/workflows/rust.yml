# Makit: format, lint and test on every supported host platform.
name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: bootstrap (Makit on its own repository)
        shell: bash
        run: ./bootstrap
      - name: bootstrap.ps1 (PowerShell twin)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1
      - name: shellcheck bootstrap
        if: runner.os == 'Linux'
        run: shellcheck bootstrap
