# FRAMEWORK FILE. User-level Nix config inside the devbox.
experimental-features = nix-command flakes
# Local binary cache shared by every project (docker volume
# agent-devbox-nix-cache). Generated settings (signing key) live next to it.
extra-substituters = file:///nix-cache?priority=10
!include /nix-cache/.box/nix.conf
warn-dirty = false
