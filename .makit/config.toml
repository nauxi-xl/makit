# Makit's own Project manifest: Makit builds its own Source tree (see ./bootstrap).

[project]
name = "makit"
makit-version = "0.1"

# Makit is built for the machine that builds it, with whatever rustc and Cargo are on PATH.
[toolchain.native]
role = "target"
RUSTC = "rustc"
CARGO = "cargo"

# Building Makit needs only Rust on the host; declaring it keeps cc/c++ out of the host Toolchain.
[toolchain.host]
role = "host"
RUSTC = "rustc"
CARGO = "cargo"
